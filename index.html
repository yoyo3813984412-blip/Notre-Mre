<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Seafood Feast Just For You</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #f7f3ed;

    font-family: Georgia, serif;

    color: #2f2b27;

    text-align: center;
}

.container {
    width: 90%;
    max-width: 700px;

    padding: 50px 25px;
}

.globe {
    font-size: 55px;
    margin-bottom: 20px;
}

h1 {
    font-size: 38px;
    letter-spacing: 4px;

    margin-bottom: 15px;
}

.subtitle {
    font-size: 17px;

    letter-spacing: 2px;

    margin-bottom: 50px;

    opacity: 0.7;
}

#countdown {
    font-size: 55px;

    letter-spacing: 6px;

    margin-bottom: 35px;
}

.message {
    font-size: 16px;

    font-style: italic;

    opacity: 0.7;
}

/* Menu initially hidden */

#menu {
    display: none;

    animation: fadeIn 2s ease;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.menu-title {

    font-size: 35px;

    letter-spacing: 5px;

    margin-bottom: 30px;
}

iframe {

    width: 100%;

    height: 850px;

    border: none;

    border-radius: 5px;

}

</style>
</head>


<body>

<div class="container">

<div id="countdownPage">

<div class="globe">🦪</div>

<h1>SEAFOOD FEAST</h1>

<div class="subtitle">

JUST FOR YOU

</div>


<div id="countdown">

03 : 00

</div>


<div class="message">

Your feast will be revealed shortly...

</div>

</div>



<div id="menu">

<div class="globe">✨</div>

<div class="menu-title">

TONIGHT'S MENU

</div>


<iframe src="menu.pdf"></iframe>

</div>


</div>



<script>

/* =================================
   COUNTDOWN: 3 MINUTES
   ================================= */

// Set reveal time to 3 minutes after
// the webpage is opened

const revealTime =
new Date().getTime() + (3 * 60 * 1000);


const countdown =
document.getElementById("countdown");

const countdownPage =
document.getElementById("countdownPage");

const menu =
document.getElementById("menu");


function updateCountdown() {

    const now =
    new Date().getTime();

    const distance =
    revealTime - now;


    if (distance <= 0) {

        countdownPage.style.display =
        "none";

        menu.style.display =
        "block";

        return;

    }


    const minutes =
    Math.floor(
        distance / (1000 * 60)
    );


    const seconds =
    Math.floor(
        (distance % (1000 * 60)) / 1000
    );


    countdown.innerHTML =

    String(minutes)
    .padStart(2, "0")

    + " : " +

    String(seconds)
    .padStart(2, "0");

}


/* Update immediately */

updateCountdown();


/* Update every second */

setInterval(
    updateCountdown,
    1000
);

</script>

</body>

</html>
