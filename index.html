<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Seafood Feast Just For You</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #f7f3ed;

    font-family: Georgia, serif;

    color: #2f2b27;

    text-align: center;

}


.container {

    width: 90%;

    max-width: 700px;

    padding: 50px 25px;

}


.globe {

    font-size: 55px;

    margin-bottom: 20px;

}


h1 {

    font-size: 38px;

    letter-spacing: 4px;

    margin-bottom: 15px;

}


.subtitle {

    font-size: 17px;

    letter-spacing: 2px;

    margin-bottom: 50px;

    opacity: 0.7;

}


#countdown {

    font-size: 55px;

    letter-spacing: 6px;

    margin-bottom: 35px;

}


.message {

    font-size: 16px;

    font-style: italic;

    opacity: 0.7;

}


/* =========================
   MENU
   ========================= */

#menu {

    display: none;

    animation: fadeIn 2s ease;

}


@keyframes fadeIn {

    from {

        opacity: 0;

        transform: translateY(20px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}


.menu-title {

    font-size: 35px;

    letter-spacing: 5px;

    margin-bottom: 30px;

}


#menu img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 5px;
}

</style>

</head>



<body>


<div class="container">


<!-- =========================
     COUNTDOWN PAGE
     ========================= -->

<div id="countdownPage">


<div class="globe">
🦪
</div>


<h1>
SEAFOOD FEAST
</h1>


<div class="subtitle">
JUST FOR YOU
</div>


<div id="countdown">
00 : 00
</div>


<div class="message">
Your feast will be revealed shortly...
</div>


</div>



<!-- =========================
     MENU PAGE
     ========================= -->

<div id="menu">


<div class="globe">
✨
</div>


<div class="menu-title">
TONIGHT'S MENU
</div>


<img src="menu.jpg" alt="Tonight's Menu">


</div>


</div>



<script>


/* ==========================================
   
   FIXED REVEAL TIME
   
   Adelaide time:
   September 4, 2026
   1:25 PM
   
   ========================================== */


const revealTime = new Date(
    "2026-09-04T16:25:00+09:30"
).getTime();



const countdown =
document.getElementById("countdown");


const countdownPage =
document.getElementById("countdownPage");


const menu =
document.getElementById("menu");



function updateCountdown() {


    const now =
    new Date().getTime();


    const distance =
    revealTime - now;



    /* =========================
       TIME HAS ARRIVED
       ========================= */


    if (distance <= 0) {


        countdownPage.style.display =
        "none";


        menu.style.display =
        "block";


        return;

    }



    /* =========================
       CALCULATE MINUTES
       ========================= */


    const minutes =
    Math.floor(
        distance / (1000 * 60)
    );



    /* =========================
       CALCULATE SECONDS
       ========================= */


    const seconds =
    Math.floor(
        (distance % (1000 * 60)) / 1000
    );



    /* =========================
       DISPLAY COUNTDOWN
       ========================= */


    countdown.innerHTML =

        String(minutes)
        .padStart(2, "0")

        + " : " +

        String(seconds)
        .padStart(2, "0");

}



/* ==========================================
   UPDATE IMMEDIATELY
   ========================================== */

updateCountdown();



/* ==========================================
   UPDATE EVERY SECOND
   ========================================== */

setInterval(
    updateCountdown,
    1000
);


</script>


</body>

</html>
